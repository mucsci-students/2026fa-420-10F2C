{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Scheduler{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'gui/css/style.css' %}">
</head>
<body>
<nav>
    <a href="{% url 'gui:index' %}" class="{% if active == 'home' %}active{% endif %}">Home</a>
    <a href="{% url 'gui:config_editor' %}" class="{% if active == 'config' %}active{% endif %}">Configuration Editor</a>
    <a href="{% url 'gui:schedule_generator' %}" class="{% if active == 'generator' %}active{% endif %}">Schedule Generator</a>
    <a href="{% url 'gui:schedule_viewer' %}" class="{% if active == 'viewer' %}active{% endif %}">Schedule Viewer</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
