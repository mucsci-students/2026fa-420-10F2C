[project]
name = "2026fa-420-10f2c"
version = "0.1.0"
description = "pyproject.toml"
authors = [
    { name = "2026fa-420-10F2C", email = "@millersville.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "course-constraint-scheduler>=3.0.0",
    "django>=6.1.1",
    "langchain>=1.4.5,<2",
    "langchain-openai>=1.7.1,<2",
    "langgraph>=1.2.15,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.coverage.run]
source = [
    "app.commands.common",
    "app.crud",
    "app.generation_job",
    "app.history",
    "app.memento",
    "app.schedule_io",
    "app.schedule_ops",
    "app.session",
]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py314"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.14.0",
    "ruff>=0.14.0",
    "ty>=0.0.1",
]
